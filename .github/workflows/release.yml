name: Update release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go 1.x
        uses: actions/setup-go@v6
        with:
          go-version: ^1.25
        id: go

      - name: Build openai
        run: GOOS="wasip1" GOARCH="wasm" go build -o openai-plugin.wasm -buildmode=c-shared plugins/openai-reviewer/main.go
      
      - name: Build gemini
        run: GOOS="wasip1" GOARCH="wasm" go build -o gemini-plugin.wasm -buildmode=c-shared plugins/gemini-reviewer/main.go

      - name: Build claude
        run: GOOS="wasip1" GOARCH="wasm" go build -o claude-plugin.wasm -buildmode=c-shared plugins/claude-reviewer/main.go

      # The ref name goes through the environment rather than being interpolated
      # into the script: a tag may contain shell metacharacters, and the v*.*.*
      # trigger glob does not exclude them. Interpolating it would let a crafted
      # tag run arbitrary commands in a job that holds contents: write, and a
      # tag containing "|" would break the sed delimiter.
      - name: Substitute WASM URLs with release version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: sed -i "s|/download/v[^/]*/|/download/$REF_NAME/|g" plugins/*-reviewer/*.yaml

      - run: go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest
      - name: Generate changelog
        env:
          REF_NAME: ${{ github.ref_name }}
        run: git-chglog -o release.txt "$REF_NAME"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          body_path: release.txt
          files: |
            openai-plugin.wasm
            plugins/openai-reviewer/openai-reviewer.yaml
            gemini-plugin.wasm
            plugins/gemini-reviewer/gemini-reviewer.yaml
            claude-plugin.wasm
            plugins/claude-reviewer/claude-reviewer.yaml
