name: Claude Reviewer
command: "!review"
runtime: "wasm"

vars:
  - name: claude_reviewer_api_key
    type:
    - env
    - secret
  - name: claude_reviewer_endpoint
    type:
    - env
    - secret
  - name: claude_reviewer_model # claude-sonnet-5 is default
    type:
    - env
    - config
  - name: claude_reviewer_prompt
    type:
    - env
    - config
  - name: claude_reviewer_max_tokens # 16000 is default, values below 8192 fall back to it
    type:
    - env
    - config
  - name: claude_reviewer_anthropic_version # 2023-06-01 is default
    type:
    - env
    - config
  - name: claude_reviewer_max_turns # 20 is default, values below 2 fall back to it
    type:
    - env
    - config
  - name: claude_reviewer_max_retries # 5 is default
    type:
    - env
    - config

wasm_config:
  exported_function: "review"
  url: "https://github.com/Gasoid/merge-bot-plugins/releases/download/v0.0.3-beta.5/claude-plugin.wasm"
  allowed_hosts:
  - "api.anthropic.com"
