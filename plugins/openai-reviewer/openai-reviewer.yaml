name: OpenAI reviewer
command: "!review"
runtime: "wasm"

vars:
  - name: reviewer_api_key
    type:
    - env
    - secret
  - name: reviewer_endpoint
    type:
    - env
    - secret
  - name: reviewer_model # gpt-5.1-codex-mini is default
    type:
    - env
    - config
  - name: reviewer_prompt
    type:
    - env
    - config
  - name: reviewer_max_turns # 20 is default
    type:
    - env
    - config
  - name: reviewer_max_retries # 5 is default
    type:
    - env
    - config
  - name: reviewer_reasoning_effort # optional; defaults to 'none' when tools are used
    type:
    - env
    - config

wasm_config:
  exported_function: "review"
  url: "https://github.com/Gasoid/merge-bot-plugins/releases/download/v0.0.3-beta.2/openai-plugin.wasm"
  allowed_hosts:
  - "api.openai.com"
